<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo-wrap"><img src="assets/img/logo-clowderhub.png" alt="ClowderHub" width="180" height="36"></a>
      <button class="hamburger-btn" id="mobile-menu-btn" aria-label="Toggle navigation menu" aria-expanded="false">
        <span class="hamburger-icon">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
      <nav>
        <ul class="nav-menu" id="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="guides/best-automatic-litter-box.html" class="nav-link">Best Automatic Boxes</a></li>
          <li><a href="guides/best-self-cleaning-litter-box-for-multiple-cats.html" class="nav-link">Multi-Cat Guide</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main style="padding: 90px 0 120px; text-align: center;">
    <div class="article-container">
      <div style="font-size: 64px; margin-bottom: 16px;"></div>
      <h1 style="font-size: 36px; font-weight: 800; margin-bottom: 14px;">404 – Page Not Found</h1>
      <p style="font-size: 17px; color: var(--color-slate); max-width: 520px; margin: 0 auto 30px; line-height: 1.6;">
        The page you are looking for may have been moved, renamed, or does not exist.
      </p>
      <div style="display: flex; gap: 14px; justify-content: center;">
        <a href="index.html" class="nav-cta" style="padding: 10px 22px;">Return to Home &rarr;</a>
        <a href="guides/best-automatic-litter-box.html" style="display: inline-block; padding: 10px 22px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-weight: 600;">Explore Automatic Litter Boxes</a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 ClowderHub. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Back to Top Floating Button with Circular Scroll Progress -->
  <button id="backToTopBtn" class="back-to-top-btn" type="button" aria-label="Scroll back to top" title="Back to top">
    <svg class="progress-ring" width="48" height="48" viewBox="0 0 48 48">
      <circle class="progress-ring__circle-bg" stroke="rgba(0, 178, 137, 0.2)" stroke-width="3" fill="transparent" r="21" cx="24" cy="24"/>
      <circle id="scrollProgressCircle" class="progress-ring__circle" stroke="#00b289" stroke-width="3" stroke-linecap="round" fill="transparent" r="21" cx="24" cy="24"/>
    </svg>
    <span class="back-to-top-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </span>
  </button>


  <script>
    const menuBtn = document.getElementById('mobile-menu-btn');
    const navMenu = document.getElementById('nav-menu');
    if (menuBtn && navMenu) {
      menuBtn.addEventListener('click', () => {
        const isOpen = navMenu.classList.toggle('open');
        menuBtn.classList.toggle('active', isOpen);
        menuBtn.setAttribute('aria-expanded', isOpen);
      });
      document.addEventListener('click', (e) => {
        if (!navMenu.contains(e.target) && !menuBtn.contains(e.target) && navMenu.classList.contains('open')) {
          navMenu.classList.remove('open');
          menuBtn.classList.remove('active');
          menuBtn.setAttribute('aria-expanded', 'false');
        }
      });
      navMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          navMenu.classList.remove('open');
          menuBtn.classList.remove('active');
          menuBtn.setAttribute('aria-expanded', 'false');
        });
      });
    }
  
    // Back to top floating button logic
    const bttBtn = document.getElementById('backToTopBtn');
    const bttCircle = document.getElementById('scrollProgressCircle');
    if (bttBtn && bttCircle) {
      const circumference = 2 * Math.PI * 21;
      bttCircle.style.strokeDasharray = `${circumference} ${circumference}`;
      bttCircle.style.strokeDashoffset = circumference;

      function updateBttProgress() {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        const scrollHeight = document.documentElement.scrollHeight || document.body.scrollHeight || 0;
        const clientHeight = window.innerHeight || document.documentElement.clientHeight || 0;
        const docHeight = scrollHeight - clientHeight;

        if (scrollTop > 280) {
          bttBtn.classList.add('is-visible');
        } else {
          bttBtn.classList.remove('is-visible');
        }

        if (docHeight > 0) {
          const progress = Math.min(Math.max(scrollTop / docHeight, 0), 1);
          bttCircle.style.strokeDashoffset = circumference - (progress * circumference);
        }
      }

      bttBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      window.addEventListener('scroll', updateBttProgress, { passive: true });
      window.addEventListener('resize', updateBttProgress, { passive: true });
      updateBttProgress();
    }

  </script>
</body>
</html>
